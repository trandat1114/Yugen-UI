version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["area: build & package"]
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/*", "jsdom"]
      build:
        patterns: ["vite", "vite-node", "@vitejs/*", "tailwindcss", "@tailwindcss/*", "typescript", "tsc-alias"]
    ignore:
      # Major của React / Tailwind cần RFC + kiểm thử riêng (GOVERNANCE.md).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["area: ci & tests"]
