name: Documentation
description: A wrong example, missing props, unclear guidance, a translation.
title: "[Docs]: "
labels: ["documentation", "area: docs site", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Vietnamese. · Bạn có thể viết bằng tiếng Việt.
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: "https://trandat1114.github.io/Yugen-UI/components/datagrid"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Example is wrong
        - Missing or wrong props
        - Unclear guidance
        - Translation (English or Vietnamese)
        - Docs site UI bug
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong and how it should read. You can paste a translation here.
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a PR myself (see CONTRIBUTING.md)
