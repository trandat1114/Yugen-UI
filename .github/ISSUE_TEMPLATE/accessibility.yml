name: Accessibility issue
description: Keyboard, screen readers, focus, contrast, high contrast, RTL.
title: "[A11y]: "
labels: ["accessibility", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Yugen UI targets WCAG 2.1 AA (see ACCESSIBILITY.md and https://trandat1114.github.io/Yugen-UI/concepts/accessibility).
        You can write in English or Vietnamese. · Bạn có thể viết bằng tiếng Việt.
  - type: input
    id: component
    attributes:
      label: Component / docs page
      placeholder: "Combobox — https://trandat1114.github.io/Yugen-UI/components/combobox"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Kind
      multiple: true
      options:
        - Keyboard / focus
        - Screen reader (name, role, state)
        - Colour contrast
        - High contrast / forced colors
        - RTL
        - Motion (prefers-reduced-motion)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did (keys pressed), what you heard or saw, and what you expected.
      placeholder: |
        1. Tab into the Combobox
        2. Press ArrowDown
        3. NVDA reads "…", expected "…"
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Browser & assistive technology
      placeholder: "Edge 140 + NVDA 2025.1, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme / text direction
      multiple: true
      options: [Light, Dark, High contrast, RTL]
  - type: textarea
    id: axe
    attributes:
      label: axe / Lighthouse results (if any)
      render: text
