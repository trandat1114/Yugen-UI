name: Docs

# Builds the documentation site and deploys it to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main, next] # push vào next → job redispatch chạy lại trên main để cập nhật /next/
    # Như ci.yml, thêm các file docs không hiển thị: tin lấy từ news.ts, lộ trình từ roadmap.ts.
    paths-ignore:
      - "wiki/**"
      - "README.md"
      - "ACCESSIBILITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "Design.md"
      - "LICENSE"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "packages/*/README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "packages/*/CHANGELOG.md"
      - ".changeset/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Environment github-pages chỉ cho main deploy → push vào next chỉ kích hoạt lại workflow trên main để cập nhật /next/.
  redispatch:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # gốc site luôn là main; next và các minor cũ build thêm bằng git worktree
          fetch-depth: 0 # cần tag và nhánh next

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run build:docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      # One Open Graph image per page (dist-docs/og/, read from routes.json), drawn with Playwright's Chromium.
      - name: Open Graph images
        run: |
          npx playwright install --with-deps chromium
          node scripts/og-pages.mjs

      - name: Versioned docs (older minors from tags)
        run: node scripts/build-versioned-docs.mjs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      # The router uses the URL hash, so one index.html serves every page; 404.html covers mistyped paths.
      - run: cp dist-docs/index.html dist-docs/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
