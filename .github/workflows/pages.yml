name: Docs

# Builds the documentation site and deploys it to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần tag để build docs các phiên bản cũ

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run build:docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      - name: Versioned docs (older minors from tags)
        run: node scripts/build-versioned-docs.mjs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      # The router uses the URL hash, so one index.html serves every page; 404.html covers mistyped paths.
      - run: cp dist-docs/index.html dist-docs/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
