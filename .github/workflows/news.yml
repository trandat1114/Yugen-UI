name: News

# Tin của trang Có gì mới viết bằng Markdown (src/docs/news, #261). CI đầy đủ bỏ qua PR chỉ sửa tin; workflow này kiểm tra
# định dạng, bản vi / en khớp nhau và quy tắc cho từng số (scripts/check-news.mjs). Không cần npm ci: script chỉ dùng Node.
on:
  pull_request:
    branches: [main, next, "release/**", canary]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/docs/news/**"
      - "scripts/news.mjs"
      - "scripts/check-news.mjs"
      - "scripts/release-rules.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check news
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/check-news.mjs
