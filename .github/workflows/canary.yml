name: Canary

# Bản thử nghiệm: mỗi push vào nhánh `canary` (hoặc chạy tay) phát hành `x.y.z-canary-<thời gian>` với dist-tag `canary`.
# Người dùng thử: npm install yugen-ui@canary — không bao giờ ảnh hưởng `latest` hay `next`.

on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Snapshot version
        run: |
          # Changesets không cho snapshot ở chế độ pre (nhánh next có .changeset/pre.json) → dùng npm version.
          if [ ! -f .changeset/pre.json ] && ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            npx changeset version --snapshot canary
          else
            npm version --no-git-tag-version "$(node -p "require('./package.json').version")-canary-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "Version: $(node -p "require('./package.json').version")"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

      # --ignore-scripts: bỏ prepublishOnly (check:release đòi News/CHANGELOG cho bản ổn định); đã build & test ở trên.
      - name: Publish canary
        run: npm publish --provenance --access public --tag canary --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
