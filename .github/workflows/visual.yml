name: Visual regression

# Manual only (Actions → Visual regression → Run workflow). Screenshots differ per OS, so Linux baselines
# (e2e/__screenshots__/**/*-linux.png) are produced here. This workflow never commits: with `update` checked it
# regenerates the baselines and uploads them as the `visual-screenshots` artifact — download it, copy the files into
# e2e/__screenshots__/ and commit them in a pull request.

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Update snapshots (--update-snapshots) instead of comparing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual (${{ inputs.update && 'update' || 'compare' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trình duyệt và thư viện hệ thống có sẵn trong image: không `playwright install --with-deps` (apt) mỗi lần chạy.
    # Tag phải khớp @playwright/test trong package-lock.json (src/test/playwright-image.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run visual tests
        env:
          UPDATE: ${{ inputs.update }}
        run: |
          if [ "$UPDATE" = "true" ]; then
            npm run test:visual -- --update-snapshots
          else
            npm run test:visual
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots (baselines)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots
          path: e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
