name: Release CLI

# Phát hành `@yugen-ui/cli` + `create-yugen-ui` (packages/) — tách khỏi release.yml của yugen-ui (tag v*).
# Quy tắc và các bước: wiki › Release Process › CLI. Kiểm tra: packages/cli/scripts/check-release.mjs.
# Bản ổn định tag cli@X.Y.Z trên main (dist-tag latest), prerelease cli@X.Y.Z-beta.N trên next (dist-tag next).
# Mỗi gói chỉ publish khi version của nó chưa có trên npm → chạy lại được nếu một bước publish lỗi.

on:
  push:
    tags: ["cli@*"]

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cần lịch sử nhánh để kiểm tra tag nằm đúng nhánh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, #202) cần npm ≥ 11.5.1. npm dùng OIDC khi gói đã khai báo trusted publisher trên
      # npmjs.com và chỉ quay về NODE_AUTH_TOKEN khi chưa có — giữ token tới bản phát hành đầu tiên chạy bằng OIDC.
      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - run: npm ci --prefix packages/cli

      - name: Check release rules (tag, version, CHANGELOG, branch) and choose dist-tag
        id: channel
        run: echo "dist_tag=$(node packages/cli/scripts/check-release.mjs --tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck --prefix packages/cli
      - run: npm test --prefix packages/cli
      - run: npm run smoke --prefix packages/cli

      - name: Publish @yugen-ui/cli (if its version is new)
        working-directory: packages/cli
        run: |
          NAME_VERSION="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if [ "$(npm view "$NAME_VERSION" version 2>/dev/null)" != "" ]; then
            echo "$NAME_VERSION is already published — skipping."
          else
            npm publish --provenance --access public --tag "${{ steps.channel.outputs.dist_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-yugen-ui (if its version is new; stable releases only)
        if: steps.channel.outputs.dist_tag == 'latest'
        working-directory: packages/create-yugen-ui
        run: |
          NAME_VERSION="create-yugen-ui@$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME_VERSION" version 2>/dev/null)" != "" ]; then
            echo "$NAME_VERSION is already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Release từ packages/cli/CHANGELOG.md. Không đánh dấu "Latest" để trang repo vẫn chỉ bản yugen-ui.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME đã có — bỏ qua."; exit 0
          fi
          VERSION="${GITHUB_REF_NAME#cli@}"
          CREATE="$(node -p "require('./packages/create-yugen-ui/package.json').version")"
          {
            if [ "$DIST_TAG" = "latest" ]; then echo "\`@yugen-ui/cli\` $VERSION and \`create-yugen-ui\` $CREATE."; else echo "\`@yugen-ui/cli\` $VERSION (\`npx @yugen-ui/cli@next\`)."; fi
            echo
            node scripts/release-notes.mjs packages/cli/CHANGELOG.md "$VERSION"
            echo
            echo "Full notes: [packages/cli/CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/packages/cli/CHANGELOG.md) · [News](https://trandat1114.github.io/Yugen-UI/en/news)"
          } > "$RUNNER_TEMP/notes.md"
          FLAGS="--latest=false"
          [ "$DIST_TAG" = "latest" ] || FLAGS="$FLAGS --prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "@yugen-ui/cli $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS
