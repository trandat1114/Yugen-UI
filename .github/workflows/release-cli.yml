name: Release CLI

# Phát hành `@yugen-ui/cli` + `create-yugen-ui` (packages/) — tách khỏi release.yml của yugen-ui (tag v*).
# Quy tắc và các bước: wiki › Release Process › CLI. Kiểm tra: packages/cli/scripts/check-release.mjs.
# Bản ổn định tag cli@X.Y.Z trên main (dist-tag latest), prerelease cli@X.Y.Z-beta.N trên next (dist-tag next).
# Mỗi gói chỉ publish khi version của nó chưa có trên npm → chạy lại được nếu một bước publish lỗi.

on:
  push:
    tags: ["cli@*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cần lịch sử nhánh để kiểm tra tag nằm đúng nhánh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci --prefix packages/cli

      - name: Check release rules (tag, version, CHANGELOG, branch) and choose dist-tag
        id: channel
        run: echo "dist_tag=$(node packages/cli/scripts/check-release.mjs --tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck --prefix packages/cli
      - run: npm test --prefix packages/cli
      - run: npm run smoke --prefix packages/cli

      - name: Publish @yugen-ui/cli (if its version is new)
        working-directory: packages/cli
        run: |
          NAME_VERSION="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if [ "$(npm view "$NAME_VERSION" version 2>/dev/null)" != "" ]; then
            echo "$NAME_VERSION is already published — skipping."
          else
            npm publish --provenance --access public --tag "${{ steps.channel.outputs.dist_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-yugen-ui (if its version is new; stable releases only)
        if: steps.channel.outputs.dist_tag == 'latest'
        working-directory: packages/create-yugen-ui
        run: |
          NAME_VERSION="create-yugen-ui@$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME_VERSION" version 2>/dev/null)" != "" ]; then
            echo "$NAME_VERSION is already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
