name: CI

on:
  push:
    branches: [main, next, "release/**", canary]
  pull_request:
    branches: [main, next, "release/**", canary]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:classes
      # package.json = news.ts = CHANGELOG.md (scripts/check-release.mjs)
      - run: npm run check:release
      - run: npm run check:examples
      - run: npm run check:props
      - run: node scripts/sync-templates.mjs --check
      - run: npm run build:lib
      - run: npm run build:docs
      - run: npm run pack:check
      # Size budgets (.size-limit.cjs) — measured on the dist/ just built.
      - run: npm run size

  unit:
    name: Unit tests (React 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  react-19:
    name: React 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Swap the dev copies of React for 19 in this workspace only (package.json / lockfile stay on 18).
      - name: Install React 19 (not saved)
        run: npm i --no-save --no-audit --no-fund react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
      - run: node -p "'react ' + require('react/package.json').version + ', @types/react ' + require('@types/react/package.json').version"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
