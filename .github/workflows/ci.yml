name: CI

# Push / PR chỉ đổi tài liệu để đọc thì không chạy. Danh sách cố ý không có file mà CI đọc: CHANGELOG.md (check:release),
# ROADMAP.md (roadmap.test.ts), packages/cli/CHANGELOG.md (check-release của CLI), Markdown trong src/ và templates/ (bài
# blog của template, README do sync-templates sinh). Cùng danh sách ở engines.yml và pages.yml. Ngoại lệ: tin của trang Có gì
# mới (src/docs/news, #261) — news.yml kiểm tra riêng trong vài giây; pages.yml vẫn build lại docs.
on:
  push:
    branches: [main, next, "release/**", canary]
    paths-ignore:
      - "wiki/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "Design.md"
      - "Design.vi.md"
      - "LICENSE"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "packages/*/README.md"
      - "src/docs/news/**" # tin dạng Markdown: news.yml kiểm tra, pages.yml build lại docs
  pull_request:
    branches: [main, next, "release/**", canary]
    # PR draft không chạy CI (bấm "Ready for review" để chạy một lần).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "wiki/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "Design.md"
      - "Design.vi.md"
      - "LICENSE"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "packages/*/README.md"
      - "src/docs/news/**" # tin dạng Markdown: news.yml kiểm tra, pages.yml build lại docs
  # node-versions.yml gọi CI trên nhánh PR nó tạo (PR do GITHUB_TOKEN mở không tự chạy workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Node ${{ matrix.node }}
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 2 bản LTS mới nhất (LTS_LINES trong scripts/node-versions.mjs); node-versions.yml mở PR khi lịch Node đổi.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      # TypeScript 7 (bản native): typecheck, d.ts, và type checker cho check:props qua API đồng bộ của nó (#310).
      - run: npm run typecheck
      # Kết quả lint:classes theo từng class (scripts/canonical-classes.mjs): ~20 s khi tính mới, ~1 s khi có cache.
      # Khoá đổi khi CSS trong src, Tailwind (package-lock.json) hoặc script đổi — script tự kiểm tra lại khoá bên trong file.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/yugen-canonical-classes.json
          key: canonical-classes-${{ hashFiles('src/**/*.css', 'scripts/canonical-classes.mjs', 'package-lock.json') }}
      - run: npm run lint:classes
      # package.json = src/docs/news = CHANGELOG.md (scripts/check-release.mjs)
      - run: npm run check:release
      # Loại bump của changeset; PR vào main / release/* chỉ mang patch (scripts/check-changesets.mjs)
      - run: npm run check:changesets
      - run: npm run check:examples
      - run: npm run check:props
      # Code mẫu và block viết bằng tiếng Anh, trừ demo nói về ngôn ngữ (ALLOW trong scripts/check-demo-language.mjs)
      - run: npm run check:demo-language
      - run: node scripts/sync-templates.mjs --check
      # Icon có sẵn (src/components/ui/_internal/icons.tsx) khớp với các icon component đang import (#320).
      - run: node scripts/icons.mjs --check
      - run: npm run build:lib
      # The built package (scripts/check-package.mjs): every yugen-ui/<Folder> subpath loads in Node and shares the root's
      # modules, a nodenext consumer finds a type for every export, the server-safe files have no "use client" (#343–#345).
      - run: npm run check:package
      # esbuild with `splitting: true`: subpath imports keep the parts that load on demand (Toaster, Breadcrumb's menu,
      # citation card) out of the first chunk, as Quick start and Performance say (#370).
      - run: node scripts/check-esbuild-splitting.mjs
      # Are the Types Wrong: types match the JS for node16 (ESM) and bundler. ESM-only package, so node10 / require are
      # ignored; the CSS files have no types; ./* is a pattern, so a few subpaths stand in for it.
      - run: >-
          npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
          --exclude-entrypoints ./theme.css ./theme-core.css ./styles.css ./tokens.css
          --include-entrypoints ./Button ./Chart ./AIKit
      - run: npm run build:docs
      - run: npm run pack:check
      # Size budgets (.size-limit.cjs) — measured on the dist/ just built.
      - run: npm run size
      # Budgets stay tight: fails when a limit is more than 20% above the measured size, so the PR that makes an entry
      # smaller lowers its limit too (#360).
      - run: node scripts/check-size-slack.mjs

  unit:
    name: Unit tests (React 19)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      # Coverage theo thư mục component (vitest.config.ts › coverage), so với mức sàn trong scripts/test-floor.json (#167):
      # thư mục mới phải có test, % dòng của mỗi thư mục không được giảm.
      - run: npx vitest run --coverage
      - run: node scripts/check-test-floor.mjs
      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

  # CLI `yugen` (packages/cli) — package độc lập, lockfile riêng; template đóng gói từ templates/.
  cli:
    name: CLI · Node ${{ matrix.node }}
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Cùng các bản Node như Build.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - run: npm ci --prefix packages/cli
      - run: npm run check:release --prefix packages/cli
      - run: npm run typecheck --prefix packages/cli
      - run: npm test --prefix packages/cli
      # npm pack yugen + create-yugen-ui, cài từ .tgz, tạo app với mọi template.
      - run: npm run smoke --prefix packages/cli

  # Danh sách template cho matrix bên dưới — template mới trong templates.json được kiểm tra mà không cần sửa workflow.
  templates-list:
    name: Templates · list
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "dirs=$(node -p 'JSON.stringify(require("./templates/templates.json").map((t) => t.dir))')" >> "$GITHUB_OUTPUT"

  # Mỗi template build với yugen-ui của chính PR này (npm pack), rồi scripts/check-template.mjs: ngân sách dung lượng
  # lần tải đầu + smoke test (mọi link nội bộ render, không lỗi console, không vi phạm axe) (#145).
  templates:
    name: Template · ${{ matrix.template }}
    needs: templates-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.templates-list.outputs.dirs) }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build:lib
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      # Trỏ yugen-ui vào gói vừa pack trước lần cài đầu tiên: ở PR release (và khi vừa merge vào main) template đã ghim
      # ^<version mới> mà npm chưa có. Việc ^<version> cài được từ npm do check-release --tag của CLI kiểm, trước khi
      # publish CLI.
      - name: Build ${{ matrix.template }} with this yugen-ui
        run: |
          cp -r "templates/${{ matrix.template }}" "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm pkg set "dependencies.yugen-ui=file:$(ls "$RUNNER_TEMP"/yugen-ui-*.tgz)"
          npm install --no-audit --no-fund
          npm run build

      - run: node scripts/check-template.mjs "$RUNNER_TEMP/app" --template "${{ matrix.template }}"

      # Landing (#151): Lighthouse on mobile, performance / accessibility / best practices / SEO ≥ 95, on `vite preview` of
      # the build (scripts/lighthouse-landing.json). Chrome is Playwright's Chromium from the image; --no-sandbox in the config.
      - name: Lighthouse (mobile, all categories ≥ 95)
        if: matrix.template == 'vite-landing'
        run: |
          export CHROME_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          cd "$RUNNER_TEMP/app"
          npx --yes @lhci/cli@0.15.1 autorun --config="$GITHUB_WORKSPACE/scripts/lighthouse-landing.json"

      - name: Lighthouse scores
        if: always() && matrix.template == 'vite-landing'
        run: |
          cd "$RUNNER_TEMP/app"
          node -e '
            const fs = require("fs");
            const runs = fs.readdirSync(".lighthouseci").filter((f) => /^lhr-.*\.json$/.test(f))
              .map((f) => JSON.parse(fs.readFileSync(".lighthouseci/" + f, "utf8")));
            const rows = runs.map((r) => "| " + Object.values(r.categories).map((c) => Math.round(c.score * 100)).join(" | ") + " | " + Math.round(r.environment.benchmarkIndex) + " |");
            const text = ["### Lighthouse (mobile)", "", "| Performance | Accessibility | Best practices | SEO | Benchmark index |", "|---|---|---|---|---|", ...rows, ""].join("\n");
            console.log(text);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
          '

  # E2E chia 4 shard chạy song song (#38, #310); job "E2E (Playwright + axe)" bên dưới gộp báo cáo và là tên check cố định.
  # E2E là đường dài nhất của CI: 3 shard mất 207–249 s, 4 shard rút còn ~3/4.
  e2e:
    name: E2E · shard ${{ matrix.shard }}/4
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Trình duyệt và thư viện hệ thống có sẵn trong image: không `playwright install --with-deps` (apt) mỗi lần chạy.
    # Tag phải khớp @playwright/test trong package-lock.json (src/test/playwright-image.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      # Blob report của từng shard; job e2e-report gộp thành một báo cáo HTML.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-report:
    name: E2E (Playwright + axe)
    needs: e2e
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # Chỉ cần gói `playwright` (cùng phiên bản với package-lock.json) để gộp báo cáo, không cần `npm ci` cả repo (~20 s).
      - name: Merge reports
        run: |
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          npx --yes "playwright@$VERSION" merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail when a shard failed
        if: needs.e2e.result != 'success'
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "::error::E2E shards: $RESULT. Open the playwright-report artifact (or test-results-<shard>) for details."
          exit 1

  # Lighthouse trên vài trang prerender đại diện (#116, cấu hình ở lighthouserc.json): SEO dưới 0.95 là lỗi; trang thiếu
  # description hoặc accessibility dưới 0.95 chỉ cảnh báo. Chạy trên PR để bắt lỗi trước khi merge thay vì chặn deploy.
  lighthouse:
    name: Lighthouse
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build:docs
      # Google Chrome có sẵn trên runner.
      - run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore
