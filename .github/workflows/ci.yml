name: CI

on:
  push:
    branches: [main, next, "release/**", canary]
  pull_request:
    branches: [main, next, "release/**", canary]
    # PR draft không chạy CI (bấm "Ready for review" để chạy một lần); PR chỉ đổi Markdown / wiki cũng không chạy.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "wiki/**"
      - ".github/ISSUE_TEMPLATE/**"
  # node-versions.yml gọi CI trên nhánh PR nó tạo (PR do GITHUB_TOKEN mở không tự chạy workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Node ${{ matrix.node }}
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # LTS + Current đang được hỗ trợ (https://github.com/nodejs/Release); node-versions.yml mở PR khi lệch lịch.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:classes
      # package.json = news.ts = CHANGELOG.md (scripts/check-release.mjs)
      - run: npm run check:release
      - run: npm run check:examples
      - run: npm run check:props
      - run: node scripts/sync-templates.mjs --check
      - run: npm run build:lib
      - run: npm run build:docs
      - run: npm run pack:check
      # Size budgets (.size-limit.cjs) — measured on the dist/ just built.
      - run: npm run size

  unit:
    name: Unit tests (React 19)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  # CLI `yugen` (packages/cli) — package độc lập, lockfile riêng; template đóng gói từ templates/.
  cli:
    name: CLI · Node ${{ matrix.node }}
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Cùng các bản Node như Build; engines của CLI: node >=22.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - run: npm ci --prefix packages/cli
      - run: npm run check:release --prefix packages/cli
      - run: npm run typecheck --prefix packages/cli
      - run: npm test --prefix packages/cli
      # npm pack yugen + create-yugen-ui, cài từ .tgz, tạo app với mọi template.
      - run: npm run smoke --prefix packages/cli

  # Danh sách template cho matrix bên dưới — template mới trong templates.json được kiểm tra mà không cần sửa workflow.
  templates-list:
    name: Templates · list
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "dirs=$(node -p 'JSON.stringify(require("./templates/templates.json").map((t) => t.dir))')" >> "$GITHUB_OUTPUT"

  # Mỗi template build với yugen-ui của chính PR này (npm pack), rồi scripts/check-template.mjs: ngân sách dung lượng
  # lần tải đầu + smoke test (mọi link nội bộ render, không lỗi console, không vi phạm axe) (#145).
  templates:
    name: Template · ${{ matrix.template }}
    needs: templates-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.templates-list.outputs.dirs) }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:lib
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      # Trỏ yugen-ui vào gói vừa pack trước lần cài đầu tiên: ở PR release (và khi vừa merge vào main) template đã ghim
      # ^<version mới> mà npm chưa có. Việc ^<version> cài được từ npm do check-release --tag của CLI kiểm, trước khi
      # publish CLI.
      - name: Build ${{ matrix.template }} with this yugen-ui
        run: |
          cp -r "templates/${{ matrix.template }}" "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm pkg set "dependencies.yugen-ui=file:$(ls "$RUNNER_TEMP"/yugen-ui-*.tgz)"
          npm install --no-audit --no-fund
          npm run build

      - run: node scripts/check-template.mjs "$RUNNER_TEMP/app" --template "${{ matrix.template }}"

  # React 18.3 vẫn được hỗ trợ (peer react >=18) cho tới khi #62 quyết định ngừng.
  react-18:
    name: React 18
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Swap the dev copies of React for 18.3 in this workspace only (package.json / lockfile stay on 19).
      - name: Install React 18 (not saved)
        run: npm i --no-save --no-audit --no-fund react@^18.3 react-dom@^18.3 @types/react@^18.3 @types/react-dom@^18.3
      - run: node -p "'react ' + require('react/package.json').version + ', @types/react ' + require('@types/react/package.json').version"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

  # E2E chia 3 shard chạy song song (#38); job "E2E (Playwright + axe)" bên dưới gộp báo cáo và là tên check cố định.
  e2e:
    name: E2E · shard ${{ matrix.shard }}/3
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Trình duyệt và thư viện hệ thống có sẵn trong image: không `playwright install --with-deps` (apt) mỗi lần chạy.
    # Tag phải khớp @playwright/test trong package-lock.json (src/test/playwright-image.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Blob report của từng shard; job e2e-report gộp thành một báo cáo HTML.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-report:
    name: E2E (Playwright + axe)
    needs: e2e
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail when a shard failed
        if: needs.e2e.result != 'success'
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "::error::E2E shards: $RESULT. Open the playwright-report artifact (or test-results-<shard>) for details."
          exit 1

  # Lighthouse trên vài trang prerender đại diện (#116, cấu hình ở lighthouserc.json): SEO dưới 0.95 là lỗi; trang thiếu
  # description hoặc accessibility dưới 0.95 chỉ cảnh báo. Chạy trên PR để bắt lỗi trước khi merge thay vì chặn deploy.
  lighthouse:
    name: Lighthouse
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:docs
      # Google Chrome có sẵn trên runner.
      - run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore
