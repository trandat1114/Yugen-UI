name: Prune branches

# Ngày 1 hằng tháng: báo cáo nhánh đã hết tác dụng (scripts/prune-branches.mjs) vào job summary, không xoá gì.
# Chạy tay với apply để xoá các nhánh ở mục "Xoá". Luật: wiki › Branching and Release Channels › Dọn nhánh.

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Xoá các nhánh ở mục "Xoá" (không bao giờ xoá mục "Cần xem")
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete branches (--apply)
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report${{ inputs.apply && ' and delete' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-branches.mjs ${{ inputs.apply && '--apply' || '' }} >> "$GITHUB_STEP_SUMMARY"
