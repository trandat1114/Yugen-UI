name: Node.js versions

# Hằng tuần: so các bản Node.js trong workflow với lịch phát hành chính thức (scripts/node-versions.mjs) và mở PR vào
# next khi lệch — thêm bản Current mới, bỏ bản EOL, dời job chạy một bản lên Active LTS mới nhất (#59).
# PR do GITHUB_TOKEN tạo không tự chạy CI, nên bước cuối gọi ci.yml bằng workflow_dispatch trên nhánh của PR.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push chore/node-versions
      pull-requests: write
      actions: write # workflow_dispatch ci.yml on the PR branch
    env:
      BRANCH: chore/node-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: true # git push of the PR branch below

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Update Node.js versions
        id: update
        run: |
          node scripts/node-versions.mjs --write | tee "$RUNNER_TEMP/summary.md"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "ci: Node.js versions from the release schedule"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base next --head "$BRANCH" --title "ci: Node.js versions from the release schedule" --body-file "$RUNNER_TEMP/summary.md"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
