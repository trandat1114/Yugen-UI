name: Release

# Release flow (see CONTRIBUTING.md): `npx changeset version` → update src/docs/news (vi + en) → `npm run check:release`
# → commit → `git tag vX.Y.Z && git push --tags`. Pushing the tag runs this workflow.
# Publishes through npm trusted publishing (OIDC, no npm token): the package lists this repository and release.yml as
# its trusted publisher on npmjs.com. Needs a `repository` field in package.json that points at this GitHub repository.
# npm accepts one trusted publisher workflow per package, so canary builds (push to `canary`, or a manual run) are a
# job of this workflow too.

on:
  push:
    tags: ["v*"]
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cần lịch sử nhánh để kiểm tra tag nằm đúng nhánh

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, #202) cần npm ≥ 11.5.1. Không dùng npm token từ 0.14.0.
      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      # package.json = src/docs/news = CHANGELOG.md = tag.
      - name: Check release consistency
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"

      - name: Unit tests
        run: npm test

      - name: Build library and docs
        run: npm run build

      # Kênh phát hành theo nhánh: next → "next", main → "latest", release/X.Y (vá minor cũ) → "release-X.Y".
      - name: Choose dist-tag (and check the tag's branch)
        id: channel
        run: echo "dist_tag=$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      # prepublishOnly also runs typecheck + lint:classes + build:lib.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.channel.outputs.dist_tag }}"

      # GitHub Release từ mục CHANGELOG của bản này. Đã có release cho tag (chạy lại workflow) thì bỏ qua.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME đã có — bỏ qua."; exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          {
            node scripts/release-notes.mjs CHANGELOG.md "$VERSION"
            echo
            echo "Full notes: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) · [News](https://trandat1114.github.io/Yugen-UI/en/news)"
          } > "$RUNNER_TEMP/notes.md"
          FLAGS="--latest=false"
          [ "$DIST_TAG" = "latest" ] && FLAGS="--latest"
          case "$VERSION" in *-*) FLAGS="$FLAGS --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "yugen-ui $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS

  # Bản thử nghiệm: mỗi push vào nhánh `canary` (hoặc chạy tay) phát hành `x.y.z-canary-<thời gian>` với dist-tag `canary`.
  # Người dùng thử: npm install yugen-ui@canary — không bao giờ ảnh hưởng `latest` hay `next`.
  canary:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    concurrency:
      group: canary
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - run: npm ci

      - name: Snapshot version
        run: |
          # Changesets không cho snapshot ở chế độ pre (nhánh next có .changeset/pre.json) → dùng npm version.
          if [ ! -f .changeset/pre.json ] && ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            npx changeset version --snapshot canary
          else
            npm version --no-git-tag-version "$(node -p "require('./package.json').version")-canary-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "Version: $(node -p "require('./package.json').version")"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

      # --ignore-scripts: bỏ prepublishOnly (check:release đòi News/CHANGELOG cho bản ổn định); đã build & test ở trên.
      - name: Publish canary
        run: npm publish --provenance --access public --tag canary --ignore-scripts
