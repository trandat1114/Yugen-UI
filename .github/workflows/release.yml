name: Release

# Release flow (see CONTRIBUTING.md): `npx changeset version` → update src/docs/news.ts → `npm run check:release`
# → commit → `git tag vX.Y.Z && git push --tags`. Pushing the tag runs this workflow.
# Requires the repository secret NPM_TOKEN (npm automation / granular token with publish rights) and a
# `repository` field in package.json that points at this GitHub repository (needed for --provenance).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      # package.json = src/docs/news.ts = CHANGELOG.md = tag.
      - name: Check release consistency
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"

      - name: Unit tests
        run: npm test

      - name: Build library and docs
        run: npm run build

      # prepublishOnly also runs typecheck + lint:classes + build:lib.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
