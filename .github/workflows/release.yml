name: Release

# Release flow (see CONTRIBUTING.md): `npx changeset version` → update src/docs/news (vi + en) → `npm run check:release`
# → commit → `git tag vX.Y.Z && git push --tags`. Pushing the tag runs this workflow.
# Publishes through npm trusted publishing (OIDC, no npm token): the package lists this repository and release.yml as
# its trusted publisher on npmjs.com. Needs a `repository` field in package.json that points at this GitHub repository.
# npm accepts one trusted publisher workflow per package, so canary builds (push to `canary`, or a manual run) are a
# job of this workflow too. Keep the file name: the trusted publisher on npmjs.com is bound to it.
#
# Jobs (#379): only the publish jobs get `id-token: write`, and they run no code from the repository or its dependencies.
#   build          → npm ci, checks, tests, build, `npm pack` → artifact (.tgz + SHA256SUMS). No id-token.
#   publish        → environment `npm-release` (maintainer approval) → verify checksums → `npm publish <file>.tgz`.
#   github-release → GitHub Release from the CHANGELOG entry. `contents: write`, no id-token.
#   canary-build → canary-publish: same split for the canary channel, without the environment (no approval).

on:
  push:
    tags: ["v*"]
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and pack
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      package: ${{ steps.pack.outputs.package }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cần lịch sử nhánh để kiểm tra tag nằm đúng nhánh
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      # package.json = src/docs/news = CHANGELOG.md = tag.
      - name: Check release consistency
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"

      - name: Unit tests
        run: npm test

      - name: Build library and docs
        run: npm run build

      # Kênh phát hành theo nhánh: next → "next", main → "latest", release/X.Y (vá minor cũ) → "release-X.Y".
      - name: Choose dist-tag (and check the tag's branch)
        id: channel
        run: echo "dist_tag=$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      # What `npm publish` ran before the split: check:release + typecheck + lint:classes + build:lib.
      - name: prepublishOnly
        run: npm run prepublishOnly

      - name: Pack
        id: pack
        run: |
          OUT="$RUNNER_TEMP/npm-package"
          mkdir -p "$OUT"
          TARBALL="$(npm pack --pack-destination "$OUT" | tail -n 1)"
          PACKAGE="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          cd "$OUT"
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS
          {
            echo "tarball=$TARBALL"
            echo "package=$PACKAGE"
            echo "sums=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error

  # No checkout, no npm ci, no repo scripts: only npm itself runs while the OIDC token can be requested.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release # required reviewer; deployments only from tags v* and cli@*
    permissions:
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, #202) cần npm ≥ 11.5.1. Không dùng npm token từ 0.14.0.
      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package

      # SHA256SUMS must match the hash the build job reported, and the tarball must match SHA256SUMS.
      - name: Verify checksums
        working-directory: npm-package
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS

      # Already on npm (re-run after a later step failed) → skip.
      - name: Publish to npm (if the version is new)
        working-directory: npm-package
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          if [ "$(npm view "$PACKAGE" version 2>/dev/null)" != "" ]; then
            echo "$PACKAGE is already published — skipping."
          else
            npm publish "./$TARBALL" --provenance --access public --tag "$DIST_TAG" --ignore-scripts
          fi

  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # GitHub Release từ mục CHANGELOG của bản này. Đã có release cho tag (chạy lại workflow) thì bỏ qua.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME đã có — bỏ qua."; exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          {
            node scripts/release-notes.mjs CHANGELOG.md "$VERSION"
            echo
            echo "Full notes: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) · [News](https://trandat1114.github.io/Yugen-UI/en/news)"
          } > "$RUNNER_TEMP/notes.md"
          FLAGS="--latest=false"
          [ "$DIST_TAG" = "latest" ] && FLAGS="--latest"
          case "$VERSION" in *-*) FLAGS="$FLAGS --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "yugen-ui $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS

  # Bản thử nghiệm: mỗi push vào nhánh `canary` (hoặc chạy tay) phát hành `x.y.z-canary-<thời gian>` với dist-tag `canary`.
  # Người dùng thử: npm install yugen-ui@canary — không bao giờ ảnh hưởng `latest` hay `next`.
  canary-build:
    name: Canary · build and pack
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # A newer push cancels the build of an older one; a publish already running is left to finish (canary-publish).
    concurrency:
      group: canary
      cancel-in-progress: true
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Snapshot version
        run: |
          # Changesets không cho snapshot ở chế độ pre (nhánh next có .changeset/pre.json) → dùng npm version.
          if [ ! -f .changeset/pre.json ] && ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            npx changeset version --snapshot canary
          else
            npm version --no-git-tag-version "$(node -p "require('./package.json').version")-canary-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "Version: $(node -p "require('./package.json').version")"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib

      # --ignore-scripts: bỏ lifecycle scripts (prepublishOnly đòi News/CHANGELOG cho bản ổn định); đã build & test ở trên.
      - name: Pack
        id: pack
        run: |
          OUT="$RUNNER_TEMP/npm-package"
          mkdir -p "$OUT"
          TARBALL="$(npm pack --ignore-scripts --pack-destination "$OUT" | tail -n 1)"
          cd "$OUT"
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS
          {
            echo "tarball=$TARBALL"
            echo "sums=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-package
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error

  # No environment: canary publishes stay automatic. Same rules as `publish`: no checkout, no repo or dependency code.
  canary-publish:
    name: Canary · publish
    needs: canary-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # npm trusted publishing + provenance
    concurrency:
      group: canary-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-package
          path: npm-package

      - name: Verify checksums
        working-directory: npm-package
        env:
          SUMS: ${{ needs.canary-build.outputs.sums }}
        run: |
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS

      - name: Publish canary
        working-directory: npm-package
        env:
          TARBALL: ${{ needs.canary-build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --tag canary --ignore-scripts
