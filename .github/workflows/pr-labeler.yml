name: PR labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Chỉ đọc danh sách file thay đổi, không checkout / chạy code của PR → an toàn với pull_request_target.
      - uses: actions/labeler@v5
        with:
          sync-labels: false
