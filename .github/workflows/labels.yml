name: Labels

# Đồng bộ nhãn từ .github/labels.yml: tạo nhãn thiếu, cập nhật màu / mô tả. Không xoá nhãn không có trong file.

on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create / update labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            // YAML tối giản của labels.yml: các mục "- name:", "color:", "description:".
            const labels = [];
            for (const line of fs.readFileSync(".github/labels.yml", "utf8").split("\n")) {
              const m = line.match(/^\s*(-\s+)?(name|color|description):\s*(.*)$/);
              if (!m) continue;
              if (m[1]) labels.push({});
              labels[labels.length - 1][m[2]] = m[3].replace(/^"(.*)"$/, "$1").trim();
            }
            for (const l of labels) {
              execFileSync("gh", ["label", "create", l.name, "--color", l.color, "--description", l.description ?? "", "--force", "-R", process.env.GITHUB_REPOSITORY], { stdio: "inherit" });
            }
            console.log(`Đã đồng bộ ${labels.length} nhãn.`);
          '
