  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yugen UI — React + Tailwind CSS v4</title>
    <!-- SEO & chia sẻ link. Trang con cập nhật title / description lúc chạy (src/docs/seo.ts). -->
    <meta name="description" content="Thư viện component React cho Tailwind CSS v4: design token, component đạt WCAG 2.1 AA, theme sáng, tối, tương phản cao, RTL, registry shadcn và template dựng sẵn." />
    <meta name="theme-color" content="#c2347a" />
    <link rel="canonical" href="https://trandat1114.github.io/Yugen-UI/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yugen UI" />
    <meta property="og:title" content="Yugen UI — React + Tailwind CSS v4" />
    <meta property="og:description" content="Thư viện component React cho Tailwind CSS v4: design token, component đạt WCAG 2.1 AA, theme sáng, tối, tương phản cao và RTL." />
    <meta property="og:url" content="https://trandat1114.github.io/Yugen-UI/" />
    <meta property="og:image" content="https://trandat1114.github.io/Yugen-UI/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yugen UI: React components for Tailwind CSS v4" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Yugen UI",
        "description": "React component library for Tailwind CSS v4: design tokens, accessible Radix-based components, light, dark and high-contrast themes and RTL.",
        "url": "https://trandat1114.github.io/Yugen-UI/",
        "codeRepository": "https://github.com/trandat1114/Yugen-UI",
        "programmingLanguage": ["TypeScript", "React", "CSS"],
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "trandat1114", "url": "https://github.com/trandat1114" }
      }
    </script>
    <script>
      // Áp theme / brand / hướng chữ / ngôn ngữ trước khi React render để tránh nháy (cùng key với useAppearance).
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem("yugen-ui-appearance") || "{}"); } catch (e) {}
        var q = new URLSearchParams(location.search);
        ["theme", "brand", "dir", "lang"].forEach(function (k) { if (q.get(k)) a[k] = q.get(k); });
        var t = a.theme === "light" || a.theme === "dark" || a.theme === "high-contrast" ? a.theme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.setAttribute("data-brand", a.brand === "web" || a.brand === "teams" ? a.brand : "sakura");
        root.setAttribute("dir", a.dir === "rtl" ? "rtl" : "ltr");
        root.setAttribute("lang", a.lang === "en" ? "en" : "vi");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
