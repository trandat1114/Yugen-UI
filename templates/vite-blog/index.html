<!doctype html>
<html lang="vi" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c2347a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- seo -->
    <title>Nhật ký Sakura</title>
    <meta name="description" content="Blog viết bằng Markdown, dựng bằng Yugen UI: mục lục, thẻ, tìm kiếm, theme tối và SEO sinh sẵn lúc build." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nhật ký Sakura" />
    <meta property="og:description" content="Blog viết bằng Markdown, dựng bằng Yugen UI: mục lục, thẻ, tìm kiếm, theme tối và SEO sinh sẵn lúc build." />
    <!-- /seo -->
    <script>
      // Áp theme / brand đã lưu trước khi React render để không nháy nền (cùng khoá với App.tsx).
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem("yugen-blog-theme") || "{}"); } catch (e) {}
        var t = a.theme === "light" || a.theme === "dark" || a.theme === "high-contrast" ? a.theme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-brand", a.brand === "web" || a.brand === "teams" ? a.brand : "sakura");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
